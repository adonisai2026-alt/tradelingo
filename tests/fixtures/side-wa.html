<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;height:100vh;display:flex;font:14px sans-serif}#side{width:300px;background:#fff}#pane-side [role=listitem]{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee}#main{flex:1;display:flex;flex-direction:column}header{height:56px;background:#f0f2f5;padding:0 16px;display:flex;align-items:center}#msgs{flex:1;padding:16px}footer{padding:8px}footer div[contenteditable]{background:#fff;border:1px solid #ccc;padding:8px}.message-in,.message-out{padding:6px;margin:3px 0;background:#fff}</style></head><body>
<div id="side"><div id="pane-side" aria-label="聊天列表"></div></div>
<div id="main"><header><span dir="auto">Someone Else</span></header><div id="msgs"><div role="row"><div data-id="false_8611111111@c.us_M1"><div class="message-in"><div data-pre-plain-text="[09:00, 2026/10/15] X: "><span class="selectable-text" dir="auto"><span>hi</span></span></div></div></div></div></div><footer><div contenteditable="true" role="textbox"></div></footer></div>
<script>
window.setList = (items) => { const s = document.getElementById('pane-side'); s.innerHTML = items.map(([name, time, unread, prev]) => `<div role="listitem"><div><span dir="auto" title="${name}">${name}</span><div>${prev.startsWith('✓') ? '<span data-icon="status-dblcheck"></span>' : ''}<span title="${prev}">${prev}</span></div></div><div><div>${time}</div>${unread ? `<span aria-label="${unread} 条未读消息"><span>${unread}</span></span>` : ''}</div></div>`).join(''); };
</script></body></html>
